<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relay · Team workspace</title><link rel="stylesheet" href="/src/style.css"></head>
<body>
<header><b class="brand"><i>≋</i> Relay</b><span class="divider"></span>Team workspace <button id="account">Connect Nexconn</button></header>
<div class="layout"><aside><div class="side-head"><h2>Workspace</h2><span id="mode"></span></div><nav id="rooms"></nav><footer><b id="identity"></b><small id="session-note"></small></footer></aside>
<main><section class="heading"><small id="category"></small><h1 id="title"></h1><p id="description"></p></section>
<button id="older" hidden>Load earlier messages</button><section id="feed" aria-label="Conversation"></section>
<form id="compose"><label for="body" id="prompt">Message</label><textarea id="body" maxlength="3500" rows="2" required></textarea><div class="actions"><button id="cancel" type="button" hidden>Cancel reply</button><button class="primary" id="send">Send message ↗</button></div></form>
<p id="notice" role="status"></p></main></div>
<dialog id="connect"><form id="login"><h2>Connect to Nexconn</h2><label>App key<input name="key" required autocomplete="off"></label><label>User access token<input name="token" type="password" required autocomplete="off"></label><p id="login-error" role="status"></p><div class="actions"><button type="button" data-close>Cancel</button><button class="primary">Connect</button></div></form></dialog>
<dialog id="add"><form id="new-room"><h2 id="add-title"></h2><label id="target-label" for="target"></label><input id="target" required maxlength="100"><div class="actions"><button type="button" data-close>Cancel</button><button class="primary">Open</button></div></form></dialog>
<script type="module" src="/src/app.js"></script></body></html>
